name: Pre-Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    env:
      VERSION: "2.0.0"
      TAG: "v2.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Set NDK environment
        run: |
          NDK_HOME=$(ls -d $ANDROID_HOME/ndk/28.2.13676358 2>/dev/null || ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/$::')
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV

      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks
          cat >> local.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build PRoot native binaries
        run: |
          chmod +x build-proot.sh
          ./build-proot.sh force

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and verify Kotlin source budget
        run: |
          chmod +x ./gradlew
          ./gradlew -p build-logic test
          ./gradlew verifyKotlinFileSize

      - name: Build F-Droid Release APK
        run: ./gradlew assembleFdroidRelease -PappVersionName=${VERSION}

      - name: Rename and collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/fdroid/release -name '*.apk' -print -quit)
          cp "$APK" "dist/LxChat-v${VERSION}-android-arm64-v8a.apk"
          echo "Produced: dist/LxChat-v${VERSION}-android-arm64-v8a.apk"
          ls -lh dist/

      - name: Delete old pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## LxChat $TAG (Pre-Release)"
            echo ""
            echo "> ⚠️ 这是预发布版本，包含最新的开发中功能，可能不稳定。"
            echo ">"
            echo "> 稳定版请查看 [Releases](https://github.com/ojbkxc/Lxchat/releases/latest)。"
            echo ""
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "### Downloads"
            echo ""
            echo "- \`LxChat-v${VERSION}-android-arm64-v8a.apk\` — Android APK (arm64-v8a)"
          } > /tmp/release_notes.md
          gh release create "$TAG" \
            --title "LxChat $TAG (Pre-Release)" \
            --notes-file /tmp/release_notes.md \
            --prerelease \
            --target ${{ github.sha }} \
            $(find dist -type f)