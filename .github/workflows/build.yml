name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-version:
    if: github.ref_name != 'v2.0.0'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # Source of truth depends on the trigger:
          # - push (tag v*): extract version from the pushed tag (refs/tags/v1.0.62 -> 1.0.62).
          #   This makes `git tag v1.0.62 && git push origin v1.0.62` the only release step.
          # - workflow_dispatch (manual, no tag): fall back to the versionName hardcoded in
          #   app/build.gradle.kts so manual runs still produce a sensible version.
          if [ "${{ github.event_name }}" = "push" ]; then
            PUSH_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${PUSH_TAG#v}"
          else
            VERSION=$(grep '?: "' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          TAG="v${VERSION}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (tag: $TAG) from ${{ github.event_name }}"

  build-android:
    needs: get-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      TAG: ${{ needs.get-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Set NDK environment
        run: |
          NDK_HOME=$(ls -d $ANDROID_HOME/ndk/28.2.13676358 2>/dev/null || ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/$::')
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_HOME"

      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks
          cat >> local.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build PRoot native binaries
        run: |
          chmod +x build-proot.sh
          ./build-proot.sh force


      - uses: gradle/actions/setup-gradle@v4

      - name: Test and verify Kotlin source budget
        run: |
          chmod +x ./gradlew
          ./gradlew -p build-logic test
          ./gradlew verifyKotlinFileSize

      - name: Build F-Droid Release APK
        run: ./gradlew assembleFdroidRelease -PappVersionName=${VERSION}

      - name: Rename and collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/fdroid/release -name '*.apk' -print -quit)
          cp "$APK" "dist/LxChat-v${VERSION}-android-arm64-v8a.apk"
          echo "Produced: dist/LxChat-v${VERSION}-android-arm64-v8a.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*.apk
          if-no-files-found: error

  # ── Build the downloadable lxchat_llama.so native component ──────────────
  # This .so is NO LONGER packaged in the APK (see app/src/main/cpp/CMakeLists.txt).
  # It is built here against the NDK and uploaded as a Release Asset so the app
  # can download it at runtime into filesDir/native/lxchat_llama/liblxchat_llama.so
  # (see LlamaEngine.loadNative). Keeps the APK ~5-8MB smaller.
  build-native-llama:
    needs: get-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
      TAG: ${{ needs.get-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358 cmake;3.22.1"

      - name: Set NDK environment
        run: |
          NDK_HOME=$(ls -d $ANDROID_HOME/ndk/28.2.13676358 2>/dev/null || ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/$::')
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_HOME"

      - name: Build lxchat_llama.so for arm64-v8a
        run: |
          set -e
          ABI=arm64-v8a
          API=24
          TOOLCHAIN=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          SRC=app/src/main/cpp
          BUILD=build-native-$ABI
          mkdir -p "$BUILD"
          cmake -S "$SRC" -B "$BUILD" \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-$API \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF
          cmake --build "$BUILD" --target lxchat_llama -j "$(nproc)"

          # Stage the artifact with an ABI-tagged filename so the app can pick
          # the right one per device. The runtime path expects liblxchat_llama.so
          # inside filesDir/native/lxchat_llama/, but the Release Asset keeps the
          # ABI suffix to disambiguate when we ship more ABIs later.
          mkdir -p dist
          cp "$BUILD/liblxchat_llama.so" "dist/lxchat_llama-$ABI.so"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-native-llama
          path: dist/lxchat_llama-*.so
          if-no-files-found: error

  release:
    needs: [get-version, build-android, build-native-llama]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.get-version.outputs.tag }}
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release (APK only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          {
            echo "## LxChat $TAG"
            echo ""
            echo "### Downloads"
            echo ""
            echo "- \`LxChat-v${VERSION}-android-arm64-v8a.apk\` — Android APK (arm64-v8a)"
            echo ""
            echo "### Runtime Components"
            echo ""
            echo "- Local inference engine (\`lxchat_llama-arm64-v8a.so\`) is hosted in [lxchat-runtime](https://github.com/ojbkxc/lxchat-runtime/releases). The app downloads it on demand from Settings > System Status."
          } > /tmp/release_notes.md
          gh release create "$TAG" \
            --title "LxChat $TAG" \
            --notes-file /tmp/release_notes.md \
            --target ${{ github.sha }} \
            $(find dist -name '*.apk' -type f)

      - name: Upload .so to lxchat-runtime repo
        env:
          GH_TOKEN: ${{ secrets.LXCHAT_RUNTIME_TOKEN }}
        run: |
          gh release delete "$TAG" --repo ojbkxc/lxchat-runtime --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo ojbkxc/lxchat-runtime \
            --title "LxChat Runtime $TAG" \
            --notes "Native inference engine for LxChat $TAG" \
            --target main \
            $(find dist -name 'lxchat_llama-*.so' -type f)

      - name: Generate latest.json
        run: |
          cat > dist/latest.json <<JSONEOF
          {
            "version": "${VERSION}",
            "apk": "LxChat-v${VERSION}-android-arm64-v8a.apk",
            "body": "LxChat v${VERSION}"
          }
          JSONEOF
          cat dist/latest.json

      - name: Upload to Cloudflare R2
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Upload APK to R2
          APK_KEY=$(echo "Lxchat/LxChat-v${VERSION}-android-arm64-v8a.apk" | sed 's/\//%2F/g')
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/downloads/objects/${APK_KEY}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @dist/LxChat-v${VERSION}-android-arm64-v8a.apk
          
          # Upload latest.json to R2
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/downloads/objects/Lxchat%2Flatest.json" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @dist/latest.json
          
          echo "Uploaded APK and latest.json to Cloudflare R2"
