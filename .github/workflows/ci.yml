name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Set NDK environment
        run: |
          NDK_HOME=$(ls -d $ANDROID_HOME/ndk/28.2.13676358 2>/dev/null || ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/$::')
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV

      - name: Build PRoot native binaries
        run: |
          chmod +x build-proot.sh
          ./build-proot.sh force


      - uses: gradle/actions/setup-gradle@v4

      - name: Test and verify Kotlin source budget
        run: |
          chmod +x ./gradlew
          ./gradlew -p build-logic test
          ./gradlew verifyKotlinFileSize

      - name: Build F-Droid Debug APK
        run: |
          set +e
          ./gradlew assembleFdroidDebug --console=plain > /tmp/build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::group::gradle-fail-block"
            grep -n -A 40 "FAILURE: Build failed" /tmp/build.log | tail -50
            grep -n -A 5 "Execution failed for task" /tmp/build.log | head -60
            echo "::endgroup::"
            {
              echo "==FAIL=="; grep -n -A 40 "FAILURE: Build failed" /tmp/build.log | tail -45
              echo "==ETASK=="; grep -n -A 6 "Execution failed for task" /tmp/build.log | head -70
              echo "==E=="; grep -n "e: " /tmp/build.log | head -50
              echo "==BOT=="; tail -6 /tmp/build.log
            } | base64 -w0 | head -c 60000 | sed 's/.*/::error file=assembleFdroidDebug line=1::base64=&/'
            exit $CODE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lxchat-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error