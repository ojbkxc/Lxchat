name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Set NDK environment
        run: |
          NDK_HOME=$(ls -d $ANDROID_HOME/ndk/28.2.13676358 2>/dev/null || ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/$::')
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV

      - name: Build PRoot native binaries
        run: |
          chmod +x build-proot.sh
          ./build-proot.sh force


      - uses: gradle/actions/setup-gradle@v4

      - name: Test and verify Kotlin source budget
        run: |
          chmod +x ./gradlew
          ./gradlew -p build-logic test
          ./gradlew verifyKotlinFileSize

      - name: Build F-Droid Debug APK
        run: |
          set +e
          ./gradlew assembleFdroidDebug --console=plain > /tmp/build.log 2>&1
          CODE=$?
          git config user.email "ci@lxseek.chat"
          git config user.name "LxChat CI"
          git checkout -B ci-logs 2>/dev/null
          mkdir -p ci-logs
          if [ $CODE -ne 0 ]; then
            {
              echo "#REPORT=FAIL"
              echo "#CI_SHA=$GITHUB_SHA"
              echo "#CI_REF=$GITHUB_REF"
              echo "====ERR_MARKERS===="; grep -n -E "FAILURE:|What went wrong|Execution failed for task|Caused by:|e: file:|error:|ERROR:|ninja:|clang|arm-linux|ndk|Could not|Cannot|not found|No such" /tmp/build.log | head -80
              echo "====FAIL_BLOCK===="; grep -n -A 40 "FAILURE: Build failed" /tmp/build.log | tail -45
              echo "====WHATS_WRONG===="; grep -n -A 30 "What went wrong" /tmp/build.log | head -80
              echo "====ETASK===="; grep -n -A 8 "Execution failed for task" /tmp/build.log | head -120
              echo "====E_DIR===="; grep -n "e: " /tmp/build.log | head -120
              echo "====BOT===="; tail -8 /tmp/build.log
            } > ci-logs/build-failure.txt 2>&1
            echo "FAIL $GITHUB_SHA" > ci-logs/build-status.txt
          else
            echo "PASS $GITHUB_SHA" > ci-logs/build-status.txt
          fi
          git add ci-logs/
          git commit -m "ci report $GITHUB_SHA" -q 2>/dev/null
          git push --force origin ci-logs 2>&1 | tail -2
          exit $CODE

      - uses: actions/upload-artifact@v4
        with:
          name: lxchat-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
